[project]
name = "pdf-tk"
version = "0.1.0"
description = "A modular, memory-safe PDF toolkit."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=5.0.0",
    "pydantic>=2.9.0"
]

[project.scripts]
pdf-tk = "cli.parser:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "cli"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0"
]

[tool.mypy]
strict = true
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py314"
exclude = ["_legacy", ".mypy_cache", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"